# Defaults shared by the scripts. CLI flags override these.
panel:
  width_mm: 100        # printed panel width (height follows image aspect ratio)
  min_thickness_mm: 0.6   # brightest areas (most light passes)
  max_thickness_mm: 3.0   # darkest areas
  border_mm: 2.0       # solid border around the image at max thickness
  pixel_mm: 0.25       # mesh resolution; smaller = finer detail, bigger file
  gamma: 1.0           # >1 lightens midtones, <1 darkens
frame:
  wall_mm: 8.0         # frame border around the panel
  lip_mm: 3.0          # overlap that holds the panel in
  clearance_mm: 0.4    # extra slot room for the panel
  depth_mm: 12.0       # front-to-back depth of the frame
  base_mm: 6.0         # height of the stand foot
