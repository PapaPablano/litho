# Defaults shared by the scripts. CLI flags override these.
panel:
  width_mm: 100        # printed panel width (height follows image aspect ratio)
  min_thickness_mm: 0.6   # brightest areas (most light passes)
  max_thickness_mm: 3.0   # darkest areas
  border_mm: 4.0       # solid border around the image at max thickness
  pixel_mm: 0.25       # mesh resolution; smaller = finer detail, bigger file
  gamma: 1.0           # >1 lightens midtones, <1 darkens
frame:
  wall_mm: 8.0         # frame border around the panel
  lip_mm: 3.0          # overlap that holds the panel in
  clearance_mm: 0.4    # extra slot room for the panel
  depth_mm: 12.0       # front-to-back depth of the frame
  base_mm: 6.0         # height of the stand foot
model:
  scale_denominator: 32   # print scale 1:N for image-to-3D models
  tolerance_pct: 2.0      # each overall dimension must land within this of its target
  max_axis_stretch_pct: 5.0   # largest per-axis stretch the fit step may apply before failing
kit:
  scale_denominator: 24    # print scale 1:N for the car kit; the model: section above stays at 1:32
  joint_clearance_mm: 0.15 # gap between a pin and its socket; prove it with the joint test print
  bed_mm: 256              # printer bed edge, in mm (Elegoo Centauri Carbon 2)
